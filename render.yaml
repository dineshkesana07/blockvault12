# ==============================================================================
# BLOCKVAULT - Render Blueprint (render.yaml)
# ==============================================================================
# Place this file at the ROOT of your repository (CPP Project/)
# Render will auto-detect it and configure the service.

services:
  - type: web
    name: blockvault-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: /var/data/blockvault.db
      - key: HOST
        value: "0.0.0.0"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    disk:
      name: blockvault-data
      mountPath: /var/data
      sizeGB: 1
