<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlockVault</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1020;--card:#111A2E;--card2:#16213a;--pri:#7C5CFF;--sec:#22D3EE;--tx:#F8FAFC;--mu:#94A3B8;--bd:#243047;--ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;--r:12px;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px;font-weight:700}h2{font-size:16px;margin:0 0 12px;font-weight:600}h3{font-size:14px;margin:0;font-weight:600}
p{margin:0}.mu{color:var(--mu)}.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--bd);background:transparent;cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--card2);border-color:#34435f}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri)}.btn.pri:hover{background:#6c4aef}
.btn.dng{color:var(--bad)}.btn.dng:hover{background:rgba(239,68,68,.1);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}.btn.ico{padding:8px;border-radius:8px}.btn.w{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sec);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.busy{pointer-events:none;opacity:.8}.btn.busy::before{content:"";width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* form */
label{display:block;font-size:13px;color:var(--mu);margin:16px 0 6px;font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:#34435f}input:focus,select:focus,textarea:focus{border-color:var(--pri)}
input:disabled{opacity:.5}input.bad{border-color:var(--bad)}.fe{color:var(--bad);font-size:12px;margin-top:6px}
.fld{display:flex;gap:8px}.fld input{flex:1}
input[type=range]{padding:0;accent-color:var(--pri)}
/* cards etc */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.wrapf{flex-wrap:wrap}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em}
.tag{display:inline-flex;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd);color:var(--mu)}
.tag.ok{color:var(--ok);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}.tag.wn{color:var(--warn);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08)}.tag.bd{color:var(--bad);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid;align-items:center}
.banner.bd{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}.banner.in{border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.06)}
.empty{text-align:center;padding:48px 16px;color:var(--mu)}.empty .logo{margin:0 auto 14px;background:var(--card2);color:var(--sec);width:48px;height:48px}
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}@keyframes sh{to{background-position:-200% 0}}
.tg{position:relative;width:40px;height:22px;flex:none}.tg input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}.tg span{position:absolute;inset:0;background:var(--bd);border-radius:11px;transition:.15s}.tg span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.15s}.tg input:checked+span{background:var(--pri)}.tg input:checked+span::after{left:21px}.tg input:focus-visible+span{outline:2px solid var(--sec);outline-offset:2px}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{border-right:1px solid var(--bd);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:0 8px 18px;letter-spacing:-.01em}
.brand .m{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--pri),var(--sec));display:grid;place-items:center}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mu);cursor:pointer;font-weight:500;transition:.15s;border:0;background:none;text-align:left;width:100%}
.nv:hover{background:var(--card);color:var(--tx)}.nv.on{background:rgba(124,92,255,.14);color:var(--tx)}.nv.on svg{color:var(--pri)}
.main{min-width:0}.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:rgba(11,16,32,.9);backdrop-filter:blur(8px);z-index:5}
.srch{position:relative;flex:1;max-width:460px}.srch svg{position:absolute;left:12px;top:11px;color:var(--mu)}.srch input{padding-left:38px}
.page{padding:28px;max-width:1180px}.ph{margin-bottom:22px}
.menu{position:relative}.dd{position:absolute;right:0;top:46px;width:280px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:20}
.dd .nv{padding:9px 10px}.nd{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--sec)}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px}
.bn{display:none}
/* vault rows */
.vr{display:grid;grid-template-columns:2fr 1.6fr 1fr 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--bd);transition:background .15s}.vr:hover{background:var(--card2)}.vr.h{color:var(--mu);font-size:12px;border-top:0;font-weight:600}.vr.h:hover{background:none}
.acts{display:flex;gap:4px}.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--bd);background:none;color:var(--mu);cursor:pointer;font-weight:500}.chip:hover{color:var(--tx)}.chip.on{background:rgba(124,92,255,.16);border-color:var(--pri);color:var(--tx)}
.pub{max-width:1080px;margin:0 auto;padding:20px 24px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth .card{width:100%;max-width:420px;padding:32px}
.hero{padding:72px 0 48px;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}.hero h1{font-size:46px;line-height:1.1;margin-bottom:16px}
.glow{background:radial-gradient(600px 300px at 80% 0%,rgba(124,92,255,.18),transparent)}
.tl{position:relative}.tl .ev{position:relative;padding-left:28px;padding-bottom:18px}.tl .ev::before{content:"";position:absolute;left:5px;top:18px;bottom:-4px;width:1px;background:var(--bd)}.tl .ev:last-child::before{display:none}.tl .ev i{position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;border:2px solid var(--pri);background:var(--bg)}
.hs{overflow-wrap:anywhere;color:var(--sec)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);padding:24px;width:min(420px,92vw)}dialog::backdrop{background:rgba(5,8,18,.7)}
#toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50}
.ts{background:var(--card2);border:1px solid var(--bd);border-left:3px solid var(--ok);padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}.ts.bad{border-left-color:var(--bad)}
.wide{overflow-x:auto}
@media(max-width:1023px){.shell{grid-template-columns:72px 1fr}.side{padding:20px 10px;align-items:center}.nv span,.brand span{display:none}.nv{justify-content:center;width:44px;padding:11px}.brand{padding:0 0 18px}
.g4{grid-template-columns:1fr 1fr}.g21,.g3{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.vr{grid-template-columns:2fr 1.5fr 1fr auto}.vr .cat{display:none}}
@media(max-width:699px){.shell{grid-template-columns:1fr}.side{display:none}.page{padding:18px 16px 96px}.top{padding:12px 16px}
.g4,.g3,.g2,.g21{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}.hero{padding-top:36px}
.vr.h{display:none}.vr{grid-template-columns:1fr auto;row-gap:2px}.vr .u,.vr .pw,.vr .cat{display:none}
.bn{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
.bn button{background:none;border:0;color:var(--mu);display:grid;justify-items:center;gap:2px;font-size:11px;padding:6px;cursor:pointer}.bn button.on{color:var(--tx)}.bn button.on svg{color:var(--pri)}
.dd{position:fixed;left:12px;right:12px;width:auto;top:64px}#toasts{left:16px;right:16px;bottom:84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><div id="toasts" aria-live="polite"></div>
<dialog id="dlg"><h2 id="dt"></h2><p class="mu" id="dp"></p><div class="row" style="justify-content:flex-end;margin-top:22px"><button class="btn" id="dn">Cancel</button><button class="btn dng" id="dy">Confirm</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
const P={home:'M3 11l9-8 9 8v10H3z',lock:'M5 11h14v10H5zM8 11V7a4 4 0 018 0v4',bolt:'M13 2L4 14h7l-1 8 9-12h-7z',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',list:'M4 6h16M4 12h16M4 18h10',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',save:'M12 3v12m0 0l-4-4m4 4l4-4M4 21h16',bell:'M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8zM10 21h4',search:'M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4-4',copy:'M9 9h11v11H9zM5 15V4h11',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z',edit:'M4 20h4L19 9l-4-4L4 16z',trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',plus:'M12 5v14M5 12h14',check:'M5 12l5 5 9-10',x:'M6 6l12 12M18 6L6 18',back:'M15 5l-7 7 7 7',out:'M9 4H4v16h5M16 8l4 4-4 4M20 12H9',alert:'M12 4l9 16H3zM12 10v4M12 17v.5'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const C=[
{id:1,n:'GitHub',u:'maya@proton.me',c:'Development',s:'strong',col:'#7C5CFF',d:'github.com'},
{id:2,n:'Figma',u:'maya@proton.me',c:'Work',s:'strong',col:'#0e9f8a',d:'figma.com'},
{id:3,n:'Netflix',u:'maya.r@mail.com',c:'Entertainment',s:'weak',col:'#c2263a',d:'netflix.com'},
{id:4,n:'Chase Bank',u:'maya.rao',c:'Finance',s:'strong',col:'#2563eb',d:'chase.com'},
{id:5,n:'Amazon',u:'maya.r@mail.com',c:'Shopping',s:'reused',col:'#d97706',d:'amazon.com'},
{id:6,n:'Notion',u:'maya@proton.me',c:'Work',s:'reused',col:'#475569',d:'notion.so'},
{id:7,n:'Spotify',u:'maya.r@mail.com',c:'Entertainment',s:'weak',col:'#16a34a',d:'spotify.com'}];
const SM={strong:['ok','Strong'],weak:['bd','Weak'],reused:['wn','Reused']};
const H=['a41f…c9d2','7be0…31aa','e2c8…05f7','19d3…b86e','c07a…4e12','5f6b…d0a3'];
const A=[['Vault unlocked','Today, 09:12','ok','Verified'],['Credential edited: GitHub','Today, 09:14','ok','Verified'],['Credential added: Figma','Yesterday, 18:40','ok','Verified'],['Backup exported','Mon, 11:02','wn','Pending'],['Credential deleted: Old Forum','Sun, 20:15','bd','Needs review'],['Vault created','Sat, 08:00','ok','Verified']];
const LG=c=>`<div class="logo" style="background:${c.col}" aria-hidden="true">${c.n[0]}</div>`;
const NAV=[['dashboard','home','Dashboard'],['vault','lock','Vault'],['generator','bolt','Generator'],['security','shield','Security'],['audit','list','Audit history'],['backup','save','Backup'],['profile','user','Profile']];
const MB=['dashboard','vault','generator','security','profile'];
let q='',cat='All';
const hd=(t,s,a='')=>`<div class="ph row sp wrapf"><div><h1>${t}</h1><p class="mu">${s}</p></div>${a}</div>`;
const back=(to,l)=>`<button class="btn sm" data-go="${to}" style="margin-bottom:16px">${ic('back')}${l}</button>`;
const meter=(v,c)=>`<div class="bar"><i style="width:${v}%;background:var(--${c})"></i></div>`;
const fld=(l,id,v='',t='text',x='')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" value="${v}" ${x}>`;
/* public pages */
const V={
landing:()=>`<div class="glow"><div class="pub"><div class="row sp"><div class="brand" style="padding:0"><div class="m">${ic('lock')}</div>BlockVault</div><div class="row"><button class="btn" data-go="login">Log in</button><button class="btn pri" data-go="register">Create vault</button></div></div>
<div class="hero"><div><span class="tag">Frontend prototype</span><h1 style="margin-top:16px">One calm place for every credential.</h1><p class="mu" style="font-size:16px;margin-bottom:26px">Store, generate and organize logins in a single vault, with an audit history that shows what changed and when.</p><div class="row wrapf"><button class="btn pri" data-go="register">Create your vault</button><button class="btn" data-go="dashboard">View the demo</button></div></div>
<div class="card" style="padding:14px">${C.slice(0,4).map(c=>`<div class="row" style="padding:10px">${LG(c)}<div style="flex:1"><h3>${c.n}</h3><span class="mu">${c.u}</span></div><span class="mono mu">••••••••</span></div>`).join('')}</div></div>
<div class="grid g3" style="padding-bottom:56px">${[['lock','Organized vault','Categories, search and quick actions keep large collections tidy.'],['shield','Security center','See weak and reused passwords with clear next steps.'],['list','Audit history','Each event links to the one before it in a visible hash chain.']].map(f=>`<div class="card"><div style="color:var(--sec);margin-bottom:10px">${ic(f[0])}</div><h3>${f[1]}</h3><p class="mu" style="margin-top:6px">${f[2]}</p></div>`).join('')}</div>
<p class="mu" style="padding-bottom:32px;font-size:13px">This is a design prototype. No data is stored, encrypted or sent anywhere.</p></div></div>`,
register:()=>`<div class="auth"><div class="card"><div class="brand" style="padding:0 0 18px"><div class="m">${ic('lock')}</div>BlockVault</div><h1>Create your vault</h1><p class="mu">Choose a master password you can remember. It cannot be recovered from here.</p>
${fld('Name','rn','','text','autocomplete="name"')}${fld('Email','re','','email')}${fld('Master password','rp','','password')}<div style="margin-top:8px">${meter(55,'warn')}<p class="mu" style="font-size:12px;margin-top:6px">Strength: fair. Add length for a stronger password.</p></div>${fld('Confirm master password','rc','','password')}
<button class="btn pri w" style="margin-top:22px" data-act="load" data-to="dashboard" data-msg="Vault created">Create vault</button><p class="mu" style="margin-top:18px;text-align:center">Have an account? <a href="#login" style="color:var(--sec)">Log in</a></p></div></div>`,
login:()=>`<div class="auth"><div class="card"><div class="brand" style="padding:0 0 18px"><div class="m">${ic('lock')}</div>BlockVault</div><h1>Welcome back</h1><p class="mu">Log in to continue to your vault.</p>
${fld('Email','le','maya@proton.me','email')}${fld('Account password','lp','','password')}<div class="row sp" style="margin-top:14px"><span class="mu">Forgot password?</span></div>
<button class="btn pri w" style="margin-top:18px" data-act="load" data-to="unlock">Continue</button><p class="mu" style="margin-top:18px;text-align:center">New here? <a href="#register" style="color:var(--sec)">Create a vault</a></p></div></div>`,
unlock:()=>`<div class="auth"><div class="card" style="text-align:center"><div class="logo" style="background:rgba(124,92,255,.15);color:var(--pri);margin:0 auto 16px;width:52px;height:52px">${ic('lock')}</div><h1>Vault locked</h1><p class="mu">Enter your master password to unlock.</p>
<div style="text-align:left"><label for="up">Master password</label><input id="up" type="password" class="bad" aria-describedby="ue"><p class="fe" id="ue">That password didn't work. Check it and try again. (error state example)</p></div>
<button class="btn pri w" style="margin-top:20px" data-act="load" data-to="dashboard" data-msg="Vault unlocked">Unlock vault</button><button class="btn w" style="margin-top:10px" data-go="login">Switch account</button></div></div>`,
dashboard:()=>hd('Dashboard','Good morning, Maya. Here is your vault at a glance.',`<button class="btn pri" data-go="add">${ic('plus')}Add credential</button>`)+
`<div class="grid g4">${[['Total credentials','48','var(--tx)'],['Strong passwords','31','var(--ok)'],['Weak passwords','9','var(--bad)'],['Reused passwords','8','var(--warn)']].map(s=>`<div class="card stat"><p class="mu">${s[0]}</p><b style="color:${s[2]}">${s[1]}</b></div>`).join('')}</div>
<div class="grid g21" style="margin-top:16px"><div class="card"><div class="row sp"><h2>Recent activity</h2><button class="btn sm" data-go="audit">View all</button></div><div class="tl">${A.slice(0,5).map(a=>`<div class="ev"><i></i><div class="row sp"><h3>${a[0]}</h3><span class="tag ${a[2]}">${a[3]}</span></div><p class="mu">${a[1]}</p></div>`).join('')}</div></div>
<div class="card"><h2>Security score</h2>${ring(72)}<p class="mu" style="text-align:center;margin:10px 0 16px">17 credentials need attention.</p><button class="btn w" data-go="security">Open security center</button></div></div>`,
vault:()=>hd('Vault',`<span id="vc"></span>`,`<button class="btn pri" data-go="add">${ic('plus')}Add credential</button>`)+
`<div class="chips" style="margin-bottom:16px">${['All','Work','Development','Finance','Shopping','Entertainment'].map(k=>`<button class="chip ${k===cat?'on':''}" data-cat="${k}">${k}</button>`).join('')}</div><div class="card" style="padding:0;overflow:hidden" id="vl"></div>`,
details:()=>{const c=C[0];return back('vault','Back to vault')+`<div class="row sp wrapf ph"><div class="row">${LG(c).replace('36px','52px')}<div><h1 style="margin:0">${c.n}</h1><span class="mu">${c.d}</span></div></div><div class="row"><button class="btn" data-go="edit">${ic('edit')}Edit</button><button class="btn dng" data-act="del" data-n="${c.n}">${ic('trash')}Delete</button></div></div>
<div class="grid g21"><div class="card"><h2>Credential</h2>${[['Website','https://github.com'],['Username',c.u]].map(f=>`<label>${f[0]}</label><div class="fld"><input readonly value="${f[1]}"><button class="btn ico" data-act="copy" aria-label="Copy ${f[0]}">${ic('copy')}</button></div>`).join('')}
<label>Password</label><div class="fld"><input readonly id="dpw" type="password" value="sample-value"><button class="btn ico" data-act="reveal" aria-label="Show password">${ic('eye')}</button><button class="btn ico" data-act="copy" aria-label="Copy password">${ic('copy')}</button></div>
<label>Notes</label><p class="mu">Personal account. Two-step sign-in is enabled.</p></div>
<div class="grid" style="align-content:start"><div class="card"><h2>Health</h2><div class="row sp"><span class="mu">Strength</span><span class="tag ok">Strong</span></div><div style="margin:10px 0">${meter(88,'ok')}</div><div class="row sp"><span class="mu">Category</span><span>${c.c}</span></div><div class="row sp" style="margin-top:8px"><span class="mu">Last changed</span><span>14 days ago</span></div></div>
<div class="card"><h2>History</h2>${A.slice(1,3).map(a=>`<p style="margin-bottom:8px">${a[0]}<br><span class="mu">${a[1]}</span></p>`).join('')}</div></div></div>`},
generator:()=>hd('Password generator','Create a password with the options you choose. Sample output only.')+`<div class="grid g2"><div class="card"><h2>Result</h2><div class="fld"><input readonly id="gv" class="mono" style="font-size:15px" value="k7#Vm2-pQx9!Lw4n"><button class="btn ico" data-act="copy" aria-label="Copy">${ic('copy')}</button></div><div style="margin:14px 0 6px">${meter(90,'ok')}</div><p class="mu">Strength: strong</p><button class="btn pri w" style="margin-top:18px" data-act="gen">${ic('bolt')}Generate new</button></div>
<div class="card"><h2>Options</h2><div class="row sp"><span>Length</span><b id="gl">16</b></div><input type="range" min="8" max="40" value="16" id="gr" aria-label="Length" style="margin:10px 0 18px">${['Uppercase letters','Lowercase letters','Numbers','Symbols'].map((o,i)=>`<div class="row sp" style="padding:8px 0"><span>${o}</span><label class="tg" style="margin:0"><input type="checkbox" ${i<4?'checked':''} aria-label="${o}"><span></span></label></div>`).join('')}</div></div>`,
security:()=>hd('Security center','Your overall password health and what to improve.')+`<div class="grid g3"><div class="card"><h2>Overall strength</h2>${ring(72)}</div><div class="card"><h2>Breakdown</h2>${[['Strong',31,'ok',65],['Weak',9,'bad',19],['Reused',8,'warn',16]].map(b=>`<div style="margin-bottom:14px"><div class="row sp"><span>${b[0]}</span><span class="mu">${b[1]}</span></div><div style="margin-top:6px">${meter(b[3],b[2])}</div></div>`).join('')}</div><div class="card"><h2>Needs attention</h2><div class="stat"><b style="color:var(--bad)">9</b><span class="mu">weak credentials</span></div><div class="stat" style="margin-top:14px"><b style="color:var(--warn)">8</b><span class="mu">reused credentials</span></div></div></div>
<div class="card" style="margin-top:16px"><h2>Recommendations</h2>${[['bd','Update 9 weak passwords','Start with Netflix and Spotify.'],['wn','Use unique passwords for 8 reused logins','Amazon and Notion share a password.'],['in','Review your backup','Last export was 5 days ago.']].map(r=>`<div class="row sp" style="padding:12px 0;border-top:1px solid var(--bd)"><div class="row"><span style="color:var(--${r[0]=='bd'?'bad':r[0]=='wn'?'warn':'sec'})">${ic('alert')}</span><div><h3>${r[1]}</h3><span class="mu">${r[2]}</span></div></div><button class="btn sm" data-go="vault">Review</button></div>`).join('')}</div>`,
audit:()=>hd('Audit history','Each entry records the hash of the entry before it. Hashes below are sample values.',`<button class="btn" data-act="verify">Verify chain</button>`)+`<div class="banner in" style="margin-bottom:16px">${ic('shield')}<span>Passwords and keys are never shown in this log.</span></div><div class="card wide" style="padding:0"><div style="min-width:680px">${A.map((a,i)=>`<div class="vr" style="grid-template-columns:2fr 1.3fr 1.3fr 1fr"><div><h3>${a[0]}</h3><span class="mu">${a[1]}</span></div><div><span class="mu" style="font-size:12px">Previous hash</span><div class="mono hs">${H[(i+1)%6]}</div></div><div><span class="mu" style="font-size:12px">Current hash</span><div class="mono hs">${H[i]}</div></div><span class="tag ${a[2]}" style="justify-self:start">${a[3]}</span></div>`).join('')}</div></div>`,
profile:()=>hd('Profile and settings','Manage your account and preferences.')+`<div class="grid g2"><div class="card"><div class="row" style="margin-bottom:6px"><div class="av" style="width:52px;height:52px;font-size:18px">MR</div><div><h3>Maya Rao</h3><span class="mu">maya@proton.me</span></div></div>${fld('Display name','pn','Maya Rao')}${fld('Email','pe','maya@proton.me','email')}<button class="btn pri" style="margin-top:20px" data-act="load" data-msg="Profile saved">Save changes</button></div>
<div class="card"><h2>Preferences</h2><label for="al" style="margin-top:0">Lock vault after</label><select id="al"><option>5 minutes</option><option>15 minutes</option><option>1 hour</option></select>${['Security alerts','Weekly summary','Clear clipboard after copy'].map((o,i)=>`<div class="row sp" style="padding:12px 0;border-top:1px solid var(--bd);margin-top:${i?0:16}px"><span>${o}</span><label class="tg" style="margin:0"><input type="checkbox" ${i!=1?'checked':''} aria-label="${o}"><span></span></label></div>`).join('')}</div></div>`,
backup:()=>hd('Backup and recovery','Keep a copy of your vault and a way back in.')+`<div class="banner bd" style="margin-bottom:16px">${ic('alert')}<div style="flex:1"><b>Last backup failed.</b> <span class="mu">The file could not be saved. (error state example)</span></div><button class="btn sm" data-act="load" data-msg="Backup retried">Retry</button></div>
<div class="grid g3">${[['save','Export backup','Download a copy of your vault file.','Export vault'],['plus','Import backup','Restore from a backup file you saved earlier.','Choose file'],['lock','Recovery key','Create a key you can store offline.','Create key']].map(b=>`<div class="card"><div style="color:var(--sec);margin-bottom:10px">${ic(b[0])}</div><h3>${b[1]}</h3><p class="mu" style="margin:6px 0 18px">${b[2]}</p><button class="btn w" data-act="load" data-msg="${b[3]} (demo)">${b[3]}</button></div>`).join('')}</div>`
};
function form(edit){const c=edit?C[0]:{n:'',d:'',u:'',c:'Work'};return back(edit?'details':'vault','Back')+hd(edit?'Edit credential':'Add credential',edit?'Update the details for '+c.n+'.':'Save a new login to your vault.')+`<div class="card" style="max-width:640px"><div class="grid g2" style="gap:0 16px"><div>${fld('Website name','fn',c.n,'text','placeholder="e.g. GitHub"')}</div><div>${fld('Website URL','fu',edit?'https://'+c.d:'','url','placeholder="https://"')}</div></div>${fld('Username or email','fe2',c.u)}
<label for="fp">Password</label><div class="fld"><input id="fp" type="password" value="${edit?'sample-value':''}"><button class="btn ico" data-act="reveal2" aria-label="Show password">${ic('eye')}</button><button class="btn" data-go="generator">${ic('bolt')}Generate</button></div><div style="margin-top:8px">${meter(edit?88:0,'ok')}</div>
<label for="fc">Category</label><select id="fc">${['Work','Development','Finance','Shopping','Entertainment'].map(k=>`<option ${k==c.c?'selected':''}>${k}</option>`).join('')}</select><label for="fno">Notes</label><textarea id="fno" rows="3"></textarea>
<div class="row" style="margin-top:24px;justify-content:flex-end"><button class="btn" data-go="vault">Cancel</button><button class="btn pri" data-act="load" data-to="vault" data-msg="${edit?'Credential updated':'Credential saved'}">${edit?'Save changes':'Save credential'}</button></div></div>`}
V.add=()=>form(0);V.edit=()=>form(1);
function ring(v){const r=52,L=2*Math.PI*r;return `<svg viewBox="0 0 130 130" style="width:150px;display:block;margin:0 auto" role="img" aria-label="Score ${v} of 100"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--pri)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${L*v/100} ${L}" transform="rotate(-90 65 65)"/><text x="65" y="72" text-anchor="middle" fill="#F8FAFC" font-size="28" font-weight="700" font-family="Plus Jakarta Sans,sans-serif">${v}</text></svg>`}
function list(){const rows=C.filter(c=>(cat==='All'||c.c===cat)&&(c.n+c.u).toLowerCase().includes(q.toLowerCase())),el=$('#vl');if(!el)return;$('#vc').textContent=rows.length+' of 48 credentials shown';
el.innerHTML=rows.length?`<div class="vr h"><span>Website</span><span>Username</span><span>Password</span><span>Category</span><span>Actions</span></div>`+rows.map(c=>`<div class="vr"><div class="row">${LG(c)}<div><h3>${c.n}</h3><span class="mu" style="font-size:12px">${c.d}</span></div></div><span class="u mu">${c.u}</span><span class="pw mono">••••••••••</span><span class="cat"><span class="tag ${SM[c.s][0]}">${c.c}</span></span><div class="acts"><button class="btn ico" data-act="copy" aria-label="Copy password for ${c.n}">${ic('copy')}</button><button class="btn ico" data-go="details" aria-label="View ${c.n}">${ic('eye')}</button><button class="btn ico" data-go="edit" aria-label="Edit ${c.n}">${ic('edit')}</button><button class="btn ico dng" data-act="del" data-n="${c.n}" aria-label="Delete ${c.n}">${ic('trash')}</button></div></div>`).join(''):`<div class="empty"><div class="logo">${ic('search')}</div><h3 style="color:var(--tx)">No credentials found</h3><p>Try a different search or category.</p><button class="btn" style="margin-top:16px" data-act="clr">Clear filters</button></div>`}
/* shell + router */
const NT=[['Weak password found: Netflix','2 min ago'],['Backup export failed','Yesterday']];
function shell(r,body){const nav=a=>NAV.map(n=>`<button class="nv ${n[0]==r?'on':''}" data-go="${n[0]}" aria-label="${n[2]}">${ic(n[1])}<span>${n[2]}</span></button>`).join('');
return `<div class="shell"><aside class="side"><div class="brand"><div class="m">${ic('lock')}</div><span>BlockVault</span></div>${nav()}<div style="flex:1"></div><button class="nv" data-go="login" aria-label="Log out">${ic('out')}<span>Log out</span></button></aside>
<div class="main"><div class="top"><div class="srch">${ic('search')}<input id="gs" placeholder="Search vault" aria-label="Search vault" value="${q}"></div><div style="flex:1"></div>
<div class="menu"><button class="btn ico" data-menu="n" aria-label="Notifications">${ic('bell')}<i class="nd"></i></button><div class="dd" id="mn" hidden><h3 style="padding:8px 10px">Notifications</h3>${NT.map(n=>`<div style="padding:10px;border-top:1px solid var(--bd)"><p>${n[0]}</p><span class="mu" style="font-size:12px">${n[1]}</span></div>`).join('')}</div></div>
<div class="menu"><button class="btn ico" data-menu="p" aria-label="Account menu" style="padding:3px"><div class="av">MR</div></button><div class="dd" id="mp" hidden style="width:220px"><div style="padding:8px 10px"><h3>Maya Rao</h3><span class="mu">maya@proton.me</span></div><button class="nv" data-go="profile">${ic('user')}Profile</button><button class="nv" data-go="backup">${ic('save')}Backup</button><button class="nv" data-go="login">${ic('out')}Log out</button></div></div></div>
<main class="page" id="pg">${body}</main></div></div><nav class="bn" aria-label="Main">${MB.map(k=>{const n=NAV.find(x=>x[0]==k);return `<button class="${k==r?'on':''}" data-go="${k}">${ic(n[1])}${n[2]}</button>`}).join('')}</nav>`}
const PUB=['landing','register','login','unlock'],TAB={add:'vault',edit:'vault',details:'vault'};
function route(){const r=location.hash.slice(1)||'landing',f=V[r]||V.landing,k=V[r]?r:'landing';scrollTo(0,0);
if(PUB.includes(k)){$('#app').innerHTML=f();return}
$('#app').innerHTML=shell(TAB[k]||k,`<div class="sk" style="height:34px;width:240px;margin-bottom:24px"></div><div class="grid g4"><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div></div><div class="sk" style="height:260px;margin-top:16px"></div>`);
setTimeout(()=>{if((location.hash.slice(1)||'landing')!==r)return;$('#pg').innerHTML=f();if(k==='vault')list()},350)}
addEventListener('hashchange',route);route();
function toast(m,bad){const t=document.createElement('div');t.className='ts'+(bad?' bad':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),2400)}
function confirmD(t,p,b,cb){$('#dt').textContent=t;$('#dp').textContent=p;$('#dy').textContent=b;$('#dlg').showModal();$('#dy').onclick=()=>{$('#dlg').close();cb()};$('#dn').onclick=()=>$('#dlg').close()}
document.addEventListener('click',e=>{
const m=e.target.closest('[data-menu]');
document.querySelectorAll('.dd').forEach(d=>{if(!m||d.id!=='m'+m.dataset.menu)d.hidden=true});
if(m){const d=$('#m'+m.dataset.menu);d.hidden=!d.hidden;return}
const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
const c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));list();return}
const a=e.target.closest('[data-act]');if(!a)return;const k=a.dataset.act;
if(k==='load'){a.classList.add('busy');a.disabled=true;const old=a.textContent;a.textContent='Working…';setTimeout(()=>{a.classList.remove('busy');a.disabled=false;a.textContent=old;if(a.dataset.msg)toast(a.dataset.msg);if(a.dataset.to)location.hash=a.dataset.to},900)}
if(k==='copy')toast('Copied to clipboard (demo)');
if(k==='del')confirmD('Delete '+a.dataset.n+'?','This removes the credential from your vault. This prototype does not delete anything.','Delete credential',()=>toast(a.dataset.n+' deleted (demo)'));
if(k==='reveal'||k==='reveal2'){const i=$(k==='reveal'?'#dpw':'#fp');i.type=i.type==='password'?'text':'password'}
if(k==='gen'){const s=['k7#Vm2-pQx9!Lw4n','Tz4!rH8@vNc2-Ud6','m9Qe-5Lw#xB3pYj7'];const i=$('#gv');i.value=s[(s.indexOf(i.value)+1)%3];toast('New sample generated')}
if(k==='verify'){a.classList.add('busy');setTimeout(()=>{a.classList.remove('busy');toast('Sample check finished: 1 entry needs review',1)},1000)}
if(k==='clr'){q='';cat='All';const s=$('#gs');if(s)s.value='';route()}});
document.addEventListener('input',e=>{if(e.target.id==='gs'){q=e.target.value;if((location.hash.slice(1))!=='vault')location.hash='vault';else list()}if(e.target.id==='gr')$('#gl').textContent=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.dd').forEach(d=>d.hidden=true)});
</script></body></html>
